[project]
name = "rag-from-scratch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Shriram", email = "shriram.vibhute08@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "cookiecutter-data-science>=2.3.0",
    "dotenv>=0.9.9",
    "langchain>=1.4.4",
    "langchain-cohere>=0.6.0",
    "langchain-core>=1.6.9",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pypdf>=6.19.0",
    "streamlit>=1.65.0",
]

[project.scripts]
rag-from-scratch = "rag_from_scratch:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
